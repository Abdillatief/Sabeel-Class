<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="book-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#book-grad)" opacity="0.15" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- 3D Book Base -->
  <path d="M12 44C18 41 26 41 32 44C38 41 46 41 52 44V21C46 18 38 18 32 21C26 18 18 18 12 21V44Z" fill="url(#book-grad)" filter="url(#glow)"/>
  
  <!-- Pages -->
  <path d="M14 42C19 39.5 26 39.5 31 42V20C26 17.5 19 17.5 14 20V42Z" fill="#ffffff" fill-opacity="0.95"/>
  <path d="M50 42C45 39.5 38 39.5 33 42V20C38 17.5 45 17.5 50 20V42Z" fill="#f1f5f9" fill-opacity="0.9"/>

  <!-- Spine / Center -->
  <line x1="32" y1="20" x2="32" y2="43" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Golden Bookmark Ribbon -->
  <path d="M30 20V32L32 30L34 32V20H30Z" fill="url(#gold-grad)"/>

  <!-- Golden Stars / Sparkles -->
  <path d="M32 10L33.2 13.5L36.8 14.2L34.1 16.6L34.9 20.1L32 18.3L29.1 20.1L29.9 16.6L27.2 14.2L30.8 13.5L32 10Z" fill="url(#gold-grad)" filter="url(#glow)"/>
  <circle cx="18" cy="14" r="1.5" fill="#38bdf8" />
  <circle cx="46" cy="14" r="1.5" fill="#facc15" />
</svg>
